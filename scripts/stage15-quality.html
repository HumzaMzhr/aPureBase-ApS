<!doctype html><html lang="en"><meta charset="utf-8"><h1>Danish recognition and cached response audit</h1><p>Synthetic Danish fixtures. No human microphone or autonomous calling.</p><button id="run">Run audit</button><p id="progress">Ready</p><pre id="json"></pre><script type="module">
import {BrowserCallIO} from '/src/browserAudio.ts';
import {scenarios} from '/src/config/scenarios.ts';
import {phrases,phraseAudio} from '/src/config/phrases.ts';
const io=new BrowserCallIO();const rows=[];let abort;
document.querySelector('#run').onclick=async()=>{abort=new AbortController();try{await io.prepare({demo:true,scenario:'callback',transcriptionMode:'realtime',silenceMs:450,clinicSilenceMs:1350,manual:false,agentMic:'',clinicMic:'',agentOutput:'',clinicOutput:''},abort.signal);const lines=[...new Map(scenarios.flatMap(s=>s.clinic).map(l=>[l.id,l])).values()];for(const line of lines){document.querySelector('#progress').textContent=line.id;const capture=await io.simulate(await io.load(phraseAudio(line.id),abort.signal),'da',abort.signal,()=>{});rows.push({id:line.id,expected:line.text,transcript:capture.transcript,finalizationMs:capture.transcriptReady-capture.transcriptionStarted});document.querySelector('#json').textContent=JSON.stringify({recognition:rows},null,2);}
const cached=[];for(const text of ['Hvorfor ringer du?','Hvilken slags information sender I?','Hvordan kan man afmelde e-mails?']){document.querySelector('#progress').textContent='Recommendation: '+text;const begin=io.now();const decision=await io.recommend(text,abort.signal);const intentMs=io.now()-begin;let playbackMs;const phrase=phrases.find(p=>p.id===decision.cached_phrase_id);if(phrase){const audio=await io.load(phraseAudio(phrase.id),abort.signal);const ready=io.now();await io.play(audio,'da',abort.signal,()=>{playbackMs=io.now()-ready;});}cached.push({source:text,decision,intentMs,playbackMs,note:'Explicit benchmark approval; human decision time excluded. No ElevenLabs or translation request for cached audio.'});document.querySelector('#json').textContent=JSON.stringify({recognition:rows,cached},null,2);}
document.querySelector('#progress').textContent='COMPLETE';}catch(e){document.querySelector('#progress').textContent='FAILED: '+e.message;}finally{io.cancel();}};
</script></html>
