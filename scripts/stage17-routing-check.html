<!doctype html><html><meta charset="utf-8"><title>Stage 1.7 graph and peer isolation check</title><h1>Audio graph and WebRTC isolation check</h1><p>Pure browser integration test. Synthetic PCM only. No microphones or paid API calls. Source signal has zero outputs; target render sink is silent.</p><button id="run">Run graph and peer check</button><p id="status">Ready</p><pre id="result"></pre><script type="module">
import {ParticipantPeer} from '/src/streaming/peer.ts';
import {ContinuousPcmScheduler} from '/src/streaming/scheduler.ts';
let agent,clinic,context;
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{context=new AudioContext({sampleRate:24000});await context.resume();await context.setSinkId({type:'none'});await context.audioWorklet.addModule('/pcm-capture.js');let packets=0,energy=0;const processor=new AudioWorkletNode(context,'pcm-capture',{numberOfInputs:1,numberOfOutputs:0,channelCount:1});processor.port.onmessage=e=>{if(e.data.type==='pcm'){packets++;const v=new DataView(e.data.audio);for(let i=0;i<v.byteLength;i+=2)energy+=v.getInt16(i,true)**2;}};const tone=context.createBuffer(1,12000,24000);const f=tone.getChannelData(0);for(let i=0;i<f.length;i++)f[i]=.05*Math.sin(i/24000*2*Math.PI*440);const source=context.createBufferSource();source.buffer=tone;source.connect(processor);source.start();await new Promise(r=>setTimeout(r,650));processor.port.postMessage({type:'flush'});await new Promise(r=>setTimeout(r,50));source.disconnect();processor.disconnect();processor.port.close();if(!packets||!energy)throw new Error('Outputless capture processor did not run.');
 const voice=(await(await fetch('/api/health')).json()).danishVoice;let sourceFrames=0,targetFrames=0;let error;const failed=e=>{error=e.message;};agent=new ParticipantPeer('agent',()=>{},(_id,bytes)=>{sourceFrames++;if(bytes.length!==4800)throw new Error('Unexpected source frame');},()=>{},failed);clinic=new ParticipantPeer('clinic',()=>{},(_id,bytes)=>{targetFrames++;if(bytes.length!==4800)throw new Error('Unexpected target frame');},()=>{},failed);document.querySelector('#status').textContent='Pairing local browser peers';const invitation=await agent.invitation();const reply=await clinic.answer(invitation);await agent.accept(reply);const until=performance.now()+20000;while((!agent.connected||!clinic.connected)&&performance.now()<until)await new Promise(r=>setTimeout(r,50));if(!agent.connected||!clinic.connected)throw new Error(error||'Peers did not connect');clinic.sendPcm('HCP_INPUT_DA',99,new Uint8Array(4800));agent.send({type:'audio_open',turn:100,jitterMs:100,voice});agent.sendPcm('HCP_OUTPUT_DA',100,new Uint8Array(4800),voice);let foreignRejected=false;try{agent.sendPcm('AGENT_INPUT_EN',101,new Uint8Array(4800));}catch{foreignRejected=true;}await new Promise(r=>setTimeout(r,200));const render=new ContinuousPcmScheduler(context,'clinic','HCP_OUTPUT_DA',100,{firstAudio(){},scheduled(){},started(){},finished(){},underrun(){}});render.push(new Uint8Array(4800),voice);await render.finish();const result={workletPackets:packets,sourceEnergyNonzero:energy>0,workletOutputs:processor.numberOfOutputs,sourceListeningEdges:0,localWebrtcPaired:agent.connected&&clinic.connected,sourceFrames,targetFrames,foreignSourceOutputRejected:foreignRejected,clockUncertaintyMs:agent.clockUncertaintyMs,schedulingOverlaps:render.schedule.filter((b,i,a)=>i&&b.start<a[i-1].end).length,paidRequests:0,limitations:'Local peers and silent renderer only. No physical two-computer or headphone acceptance.'};if(sourceFrames!==1||targetFrames!==1||!foreignRejected)throw new Error('Routing counters failed');document.querySelector('#result').textContent=JSON.stringify(result,null,2);document.querySelector('#status').textContent='PASS';}catch(e){document.querySelector('#status').textContent='FAILED: '+e.message;}finally{agent?.close();clinic?.close();await context?.close();document.querySelector('#run').disabled=false;}};
</script></html>
